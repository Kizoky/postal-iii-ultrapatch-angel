//	Controller config based off of 360controller.cfg from the core folder
//	Currently WIP with the dpad being unbound(still HL2 default) and cat attach being bound to the select button on most controllers
//	This setup was tested on a Dualshock 4 through SteamInput with the layout set to "Gamepad" and a Steam Controller with the layout set to "Gamepad with Mouse Trackpad" (while setting the right touchpad click to left mouse click)
//	Current issues usually relate to menus so you should be prepared to use your mouse for menus. Other than that, navigating weapons can feel slow.
joy_name "Xbox360 controller"
joy_advanced 1
joy_advaxisx 3
joy_advaxisy 1
joy_advaxisz 0
joy_advaxisr 2
joy_advaxisu 4
joy_advaxisv 0
joy_forwardsensitivity -1
joy_sidesensitivity 1
joy_pitchsensitivity 1.0
joy_yawsensitivity -1.25
joy_autoaimdampenrange 0.85
joy_autoaimdampen 0.5
joy_lowend 0.65
joy_lowmap 0.15
joy_accelscale 1.4
joy_response_move 5
joy_response_look 1
joyadvancedupdate
crosshair 1
hud_draw_fixed_reticle 0

bind "Z AXIS POS" "+attack2"
bind "Z AXIS NEG" "+attack"

bind "JOY1" "+jump"
bind "JOY2" "+reload"
bind "JOY3" "+duck"
bind "JOY4" "+use"

bind "JOY5" "invprev"
bind "JOY6" "invnext"

bind "JOY7" "itemnext"

bind "JOY10" "toggle_cover"
bind "JOY9" "+speed"

bind "JOY8" "GameUI_Activate"

bind "POV_UP" "UseActiveItem"
bind "POV_RIGHT" "p3_ultrapatch_inv_next"
bind "POV_DOWN" "DropActiveItem"
bind "POV_LEFT" "p3_ultrapatch_inv_prev"

joystick 1
sk_autoaim_mode 2
hud_fastswitch 3
+jlook

player_limit_jump_speed 0

p3_ultrapatch_reverse_throwable_bind 1
