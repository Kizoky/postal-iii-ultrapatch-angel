// If the user doesn't have a config.cfg when they run,
// this gets executed the first time they run the engine
// It doesn't execute if they have their own config.cfg saved out.

unbindall

bind "ESCAPE"       "cancelselect"
bind "`"            "toggleconsole"
bind "w"            "+forward"
bind "s"            "+back"
bind "a"            "+moveleft"
bind "d"            "+moveright"
bind "SPACE"        "+jump"
bind "CTRL" "toggle_cover"

// Weapon quickselect...
bind "1" "select_visible_weapon 1"
bind "2" "select_visible_weapon 2"
bind "3" "select_visible_weapon 3"
bind "4" "select_visible_weapon 4"
bind "5" "select_visible_weapon 5"
bind "6" "select_visible_weapon 6"
bind "7" "select_visible_weapon 7"
bind "8" "select_visible_weapon 8"
bind "9" "select_visible_weapon 9"

// Hotkeys...
bind "j" "select_weapon emptyhands"
bind "k" "select_weapon taser"
bind "y" "select_weapon spray"
bind "o" "select_weapon shopvac"
bind "p" "select_weapon catnip"
bind "l" "select_weapon wolverine"
bind "u" "select_weapon beenest"
bind "v" "select_weapon gasoline"
bind "i" "select_weapon shovel"
bind "b" "select_weapon m60"
bind "g" "select_weapon m16"
bind "h" "select_weapon m136"
bind "m" "select_weapon molotov"
bind "n" "select_weapon grenade"
bind "t" "select_weapon deserteagle"

bind "q" "+duck"
bind "e" "+use"

bind "TAB" "toggle_p3_mission_log"

bind "r"            "+reload"
bind "ALT"          "+walk"
bind "SHIFT"        "+speed"
bind "MOUSE1"       "+attack"
bind "MOUSE2"       "+attack2"
bind "MWHEELUP"     "invprev"
bind "MWHEELDOWN"   "invnext"
bind "F5"           "jpeg"
bind "F6"           "p3_ultrapatch_quicksave"
bind "F9"           "load quick"
bind "PAUSE"        "pause"
bind "f"            "+zoom"
bind "x"			"itemnext"

// p3 gui
bind "RCTRL"        "+showitems"
bind "z"    "invprev"
bind "c"   "invnext"
bind "y"            "dropitem" 

closecaption		"2"