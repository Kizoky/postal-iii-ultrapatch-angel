// If the user doesn't have a config.cfg when they run,
// this gets executed the first time they run the engine
// It doesn't execute if they have their own config.cfg saved out.

unbindall

bind "ESCAPE"       "cancelselect"
bind "`"            "toggleconsole"
bind "w"            "+forward"
bind "s"            "+back"
bind "a"            "+moveleft"
bind "d"            "+moveright"
bind "SPACE"        "+jump"
bind "CTRL" "toggle_cover"

bind "t" "select_weapon weemote"
bind "1" "select_weapon emptyhands"
bind "2" "select_weapon taser"
bind "3" "select_weapon spray"
bind "4" "select_weapon shopvac"
bind "5" "select_weapon catnip"
bind "6" "select_weapon wolverine"
bind "7" "select_weapon beenest"
bind "8" "select_weapon gasoline"
bind "9" "select_weapon shovel"
bind "b" "select_weapon m60"
bind "g" "select_weapon m16"
bind "h" "select_weapon m136"
bind "m" "select_weapon molotov"
bind "n" "select_weapon grenade"
bind "i" "select_weapon deserteagle"
bind "y" "select_weapon shotgun"

bind "q" "+duck"
bind "e" "+use"

bind "TAB" "toggle_p3_mission_log"

bind "r"            "+reload"
bind "ALT"          "+walk"
bind "SHIFT"        "+speed"
bind "MOUSE1"       "+attack"
bind "MOUSE2"       "+attack2"
bind "MWHEELUP"     "invprev"
bind "MWHEELDOWN"   "invnext"
bind "F5"           "jpeg"
bind "F6"           "save quick"
bind "F9"           "load quick"
bind "PAUSE"        "pause"
bind "f"            "+zoom"
bind "x"			"itemnext"

// p3 gui
bind "RCTRL"        "+showitems"
bind "z"    "invprev"
bind "c"   "invnext"
bind "y"            "dropitem" 

closecaption		"2"