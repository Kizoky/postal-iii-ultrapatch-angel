// Performance enhancements...
mat_queue_mode -2
physx_enabled 1
r_threaded_particles 1
r_threaded_renderables 1
snd_mix_async 1
ai_expression_optimization 1
r_fastzreject -1
cl_forcepreload 1
mat_forcemanagedtextureintohardware 1

// Subtitles...
cc_lang english
cl_language english

// Crosshair...
p3_cl_crosshair_stop_radius 15
p3_cl_crosshair_walk_radius 15

// Camera offsets...
exec ultrapatch_cam.cfg 

// (Uncomment these lines to disable features you don't want to play with)
//p3_ultrapatch_jump_enabled 0
//p3_ultrapatch_dude_ragdoll 0
//p3_ultrapatch_fire_spreading 0
//p3_ultrapatch_segway_leaning 0
//p3_ultrapatch_cam_lerp 0