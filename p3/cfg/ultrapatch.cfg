// Performance enhancements...
mat_queue_mode -1
r_threaded_particles 1
r_threaded_renderables 1
ai_expression_optimization 1
r_fastzreject -1
cl_forcepreload 1
mat_forcemanagedtextureintohardware 1

// NOTE: Ultrapatch now has its own ragdoll manager
// DO NOT reset these values!!
g_ragdoll_maxcount 9999
g_ragdoll_important_maxcount 9999

// This must always be 0 otherwise you get an annoying black screen flash
sv_forcepreload 0

// Subtitles...
cc_lang english
cl_language english

// Crosshair...
p3_cl_crosshair_stop_radius 15
p3_cl_crosshair_walk_radius 15

cl_localnetworkbackdoor 1 // Fixes "unreliable snapshot" error in MP and very rarely in SP

// If the sound expanded plugin is used this will fix delay issues
snd_mixahead 0.05

// Camera offsets...
exec ultrapatch_cam.cfg 

// Multiplayer
exec ultrapatch_mp.cfg